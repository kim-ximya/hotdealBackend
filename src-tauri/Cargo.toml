[package]
name = "hotdeal-collector"
version = "2.0.0"
edition = "2021"
default-run = "hotdeal-collector"

[profile.release]
strip = "symbols"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-opener", "dep:tauri-plugin-updater"]

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
fs2 = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal", "io-util"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
url = "2"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Media_Audio", "Win32_Media_Multimedia"] }
winreg = "0.55"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[[bin]]
name = "hotdeal-collector"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "hotdeal-server"
path = "src/bin/server.rs"
